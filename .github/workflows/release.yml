# Release pipeline: push a tag vX.Y.Z (matching "version" in package.json) to build and publish
#
#   ludworks-passwords-chrome-<v>.zip, ludworks-passwords-firefox-<v>.zip   (the extension)
#   LudworksBrowserSetup-<v>-win-x64.exe                                    (Ludworks Browser, Windows)
#   ludworks-browser_<v>_amd64.deb / _arm64.deb, ludworks-browser-<v>-linux-*.tar.gz
#   Ludworks-Browser-<v>-mac-arm64.dmg / -mac-x64.dmg
#   SHA256SUMS
#
# to the GitHub Release of that tag. The browser packages come from desktop.yml (called as a reusable
# workflow), so a release is built exactly like CI. A push to a branch that changes this file runs
# everything except the publish job (a dry run).
#
# Same rules as the server's release.yml: actions pinned to commit SHAs, only the publish job can write,
# and it never replaces an existing release. Build-provenance attestations need a public repository (or
# GitHub Enterprise Cloud for private ones), so they are made only when the repository is public.
# Not yet signed: Windows (Azure Artifact Signing) and macOS (Developer ID + notarization) need accounts.
name: Release

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['.github/workflows/release.yml'] # branch pushes only; tag pushes always run

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v${version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  extension:
    name: Extension (test and package)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test and build both browsers
        run: |
          node .github/check-supply-chain.mjs
          node --test "tests/*.test.mjs"
          node build.mjs
          for z in dist/*.zip; do python3 -I -m zipfile -t "$z"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Ludworks Browser
    needs: version
    uses: ./.github/workflows/desktop.yml

  publish:
    name: Publish the GitHub release
    needs: [version, extension, browser]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # Sigstore certificate for the attestation (public repositories only)
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Never replace an existing release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Published files are never replaced: delete it by hand after finding out why it exists, or release a new version."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          rm -f ./*.sha256
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the release
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          cat > notes.md <<EOF
          ## Ludworks Browser ${VERSION}

          | File | For |
          |---|---|
          | \`LudworksBrowserSetup-${VERSION}-win-x64.exe\` | Windows 10/11, per-user install (no admin needed) |
          | \`Ludworks-Browser-${VERSION}-mac-arm64.dmg\` / \`-mac-x64.dmg\` | macOS 12+ (Apple silicon / Intel) |
          | \`ludworks-browser_${VERSION}_amd64.deb\` / \`_arm64.deb\` | Debian 12+ / Ubuntu 22.04+: \`sudo apt install ./ludworks-browser_${VERSION}_amd64.deb\` |
          | \`ludworks-browser-${VERSION}-linux-*.tar.gz\` | Other Linux distributions |

          ## Ludworks Passwords extension ${VERSION}

          \`ludworks-passwords-chrome-${VERSION}.zip\` (Chrome/Edge: chrome://extensions → Developer mode → Load
          unpacked) and \`ludworks-passwords-firefox-${VERSION}.zip\`.

          \`SHA256SUMS\` detects damaged downloads; it is not a signature. The installers are not code-signed yet,
          so Windows SmartScreen and macOS Gatekeeper warn on first launch (macOS: right-click → Open).
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Ludworks Browser and Passwords ${VERSION}" --notes-file notes.md --generate-notes "${prerelease[@]}"
