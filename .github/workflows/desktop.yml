# Ludworks Browser desktop (desktop/): tests, then Windows (setup .exe + MSI), Linux (.deb, .tar.gz) and
# macOS (.dmg) packages. release.yml calls this with the release version, stamped into package.json first.
#
# Supply chain (same rules as ci.yml, enforced by .github/check-supply-chain.mjs): actions pinned to
# commit SHAs, no npm packages, no PyPI. The only third-party binary is the browser engine (castlabs
# Electron for Content Security), downloaded by desktop/build.mjs and verified against the SHA-256
# sums pinned in desktop/electron.lock.json. Go tools (winres, setup, mkdeb) are stdlib-only. The MSI is
# built with WiX 5 (the `wix` .NET tool, pinned by version).
name: Desktop browser

on:
  push:
    branches-ignore: [main] # main: release.yml builds (and releases) every push
    paths: ['desktop/**', 'src/lib/**', 'scripts/lib/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'src/lib/**', 'scripts/lib/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
  # release.yml builds the release packages with exactly these jobs.
  workflow_call:
    inputs:
      version:
        description: Release version (X.Y.Z) written into package.json before packaging
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels (or is cancelled by) CI.
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (unit, tools, logo, vectors)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/tools/go.mod
          cache: false
      - name: Stage the app and run the unit tests
        run: |
          node desktop/build.mjs stage
          node --test desktop/tests/*.test.mjs
      - name: Logo files match a fresh render
        run: node desktop/scripts/make-logo.mjs --check
      - name: Go tools (vet for Linux and Windows, tests)
        working-directory: desktop/tools
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - name: Engine pin is current (informational)
        run: node desktop/scripts/bump-electron.mjs --check || true

  windows:
    name: Windows x64 (setup .exe, MSI)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/tools/go.mod
          cache: false
      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Package and build the setup .exe
        run: node desktop/build.mjs all --target=win32-x64
      - name: Install WiX 5
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the MSI
        env:
          DOTNET_ROLL_FORWARD: Major # WiX 5 targets .NET 6; the runner has newer runtimes
        run: node desktop/build.mjs msi --target=win32-x64
      - name: The MSI installs, registers and uninstalls cleanly (per user, no admin)
        shell: pwsh
        run: |
          $msi = (Get-Item desktop/dist/LudworksBrowser-*-win-x64.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-install.log" -Tail 80; throw "install failed ($($p.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Ludworks Browser'
          if (-not (Test-Path (Join-Path $dir 'LudworksBrowser.exe'))) { throw 'the browser was not installed' }
          $caps = 'HKCU:\Software\Clients\StartMenuInternet\Ludworks Browser\Capabilities'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $caps); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $caps)) { throw 'the browser did not register itself (Default apps)' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LudworksBrowser') { throw 'an MSI install must not add its own uninstall entry' }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-uninstall.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-uninstall.log" -Tail 80; throw "uninstall failed ($($p.ExitCode))" }
          for ($i = 0; $i -lt 15 -and (Test-Path $dir); $i++) { Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem -Recurse $dir | Select-Object -First 20 | Out-String | Write-Host; throw 'the install folder was left behind' }
          if (Test-Path 'HKCU:\Software\Clients\StartMenuInternet\Ludworks Browser') { throw 'the registration was left behind' }
          Write-Host 'MSI install / uninstall OK'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludworks-browser-windows-x64
          path: |
            desktop/dist/LudworksBrowserSetup-*.exe
            desktop/dist/LudworksBrowserSetup-*.exe.sha256
            desktop/dist/LudworksBrowser-*.msi
            desktop/dist/LudworksBrowser-*.msi.sha256
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (.deb, .tar.gz)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/tools/go.mod
          cache: false
      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Package
        run: node desktop/build.mjs all --target=linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludworks-browser-linux-${{ matrix.arch }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.tar.gz
            desktop/dist/*.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} (.dmg)
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/tools/go.mod
          cache: false
      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Package the app bundle
        run: node desktop/build.mjs package --target=darwin-${{ matrix.arch }}
      - name: Ad-hoc sign (no Apple Developer ID configured) and build the disk image
        # With a Developer ID: codesign --deep --options runtime with entitlements, castlabs EVS
        # `python3 -m castlabs_evs.vmp sign-pkg` BEFORE codesign, then notarytool + stapler.
        run: |
          cd "desktop/dist/darwin-${{ matrix.arch }}"
          codesign --force --deep --sign - "Ludworks Browser.app"
          ver="$(node -p "require('../../../package.json').version")"
          hdiutil create -volname "Ludworks Browser" -srcfolder "Ludworks Browser.app" -ov -format ULFO "../Ludworks-Browser-${ver}-mac-${{ matrix.arch }}.dmg"
          cd .. && shasum -a 256 Ludworks-Browser-*.dmg > "Ludworks-Browser-${ver}-mac-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludworks-browser-macos-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.dmg.sha256
          if-no-files-found: error
