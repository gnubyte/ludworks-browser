<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ludworks Browser</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="shell.css">
  <script type="module" src="shell.js"></script>
</head>
<body>
  <header id="chrome">
    <div id="tabstrip" role="tablist" aria-label="Tabs">
      <div id="tabs"></div>
      <button id="newtab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab"></button>
      <div id="drag-spacer"></div>
      <div id="wincontrols" hidden></div>
    </div>
    <div id="toolbar">
      <button id="back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back"></button>
      <button id="forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward"></button>
      <button id="reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload"></button>
      <button id="home" class="icon-btn" title="Home" aria-label="Home" hidden></button>
      <div id="omnibox">
        <button id="siteinfo" class="omni-chip" title="View site information" aria-label="Site information"></button>
        <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search bar" placeholder="Search or enter address">
        <span id="zoom-chip" class="omni-chip" hidden></span>
        <button id="key" class="omni-chip" title="Passwords for this site" aria-label="Passwords" hidden></button>
        <button id="star" class="omni-chip" title="Bookmark this tab (Ctrl+D)" aria-label="Bookmark this tab"></button>
      </div>
      <button id="downloads" class="icon-btn" title="Downloads" aria-label="Downloads" hidden></button>
      <button id="account" class="icon-btn account-btn" title="Ludworks account" aria-label="Ludworks account"></button>
      <button id="menu" class="icon-btn" title="Settings and more (Alt+F)" aria-label="Menu"></button>
    </div>
    <nav id="bookmarks-bar" aria-label="Bookmarks bar" hidden></nav>
    <div id="findbar" hidden>
      <input id="find-input" type="text" spellcheck="false" aria-label="Find in page" placeholder="Find in page">
      <span id="find-count"></span>
      <button id="find-prev" class="icon-btn small" aria-label="Previous match"></button>
      <button id="find-next" class="icon-btn small" aria-label="Next match"></button>
      <button id="find-close" class="icon-btn small" aria-label="Close find bar"></button>
    </div>
  </header>
</body>
</html>
