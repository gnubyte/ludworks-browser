<!doctype html>
<meta charset="utf-8">
<title>Change password</title>
<link rel="stylesheet" href="fixture.css">
<h1>Change your password</h1>
<form class="card" method="post" action="/change" id="form">
  <input type="hidden" name="username" autocomplete="username" value="ludworks.autofill.test@example.com">
  <label for="old">Current password</label>
  <input id="old" name="old_password" type="password" autocomplete="current-password">
  <label for="new1">New password</label>
  <input id="new1" name="new_password" type="password" autocomplete="new-password">
  <label for="new2">Confirm new password</label>
  <input id="new2" name="new_password_confirm" type="password" autocomplete="new-password">
  <button type="submit" id="save">Change password</button>
</form>
