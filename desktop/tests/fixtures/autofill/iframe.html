<!doctype html>
<meta charset="utf-8">
<title>Login in an iframe</title>
<link rel="stylesheet" href="fixture.css">
<style>
  body { max-width: 760px; }
  iframe { width: 460px; height: 360px; border: 1px solid #d0d7de; border-radius: 10px; margin: 30px 0 0 120px; display: block; }
</style>
<h1>Account</h1>
<p>The sign-in form below is served by another site (<code>http://localhost:18121</code>), like iCloud's Apple ID
frame. Add <code>?same=1</code> for a same-origin frame.</p>
<iframe id="login-frame" title="Sign in"></iframe>
<script>
  const same = new URLSearchParams(location.search).has('same');
  document.getElementById('login-frame').src = same ? '/frame-login.html' : `http://localhost:${Number(location.port) + 1}/frame-login.html`;
</script>
