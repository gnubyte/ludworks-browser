<!doctype html>
<meta charset="utf-8">
<title>Create your account</title>
<link rel="stylesheet" href="fixture.css">
<h1>Create your account</h1>
<form class="card" method="post" action="/signup" id="form">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="12">
  <label for="confirm">Confirm password</label>
  <input id="confirm" name="password_confirmation" type="password" autocomplete="new-password">
  <button type="submit" id="create">Create account</button>
</form>
